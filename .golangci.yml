version: "2"
linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*os.File).Close
        - (*github.com/zoolcoder/scoutjobs/internal/store.Store).Close
        - (io.ReadCloser).Close
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (*net/smtp.Client).Close
        - (net.Listener).Close
        - (net.Conn).Close
        - (net.Conn).Write
        - (*text/tabwriter.Writer).Flush
        - (net/http.ResponseWriter).Write
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck]
