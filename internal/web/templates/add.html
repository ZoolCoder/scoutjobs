{{template "head" .}}
{{with .Data}}{{$j := .Job}}
<section class="panel narrow">
<div class="panel-h"><h2>Track a posting</h2><span class="act muted">same fields as <code>scoutjobs job add</code></span></div>
<form method="get" action="/jobs/new" class="fields">
  <label class="span-2">Fill from a posting URL<input name="from" type="url" value="{{.From}}" placeholder="https://boards.greenhouse.io/acme/jobs/123 · jobs.lever.co · jobs.ashbyhq.com · apply.workable.com · *.recruitee.com · *.bamboohr.com"><small class="muted">Greenhouse, Lever, Ashby, Workable, SmartRecruiters, Personio, Recruitee and BambooHR postings fill the form below. LinkedIn and Indeed have no public API: paste the text into Notes.</small></label>
  <div class="row span-2"><button>Fetch</button>{{if .Error}}<span class="callout">{{.Error}}</span>{{else if .From}}<span class="act">filled from {{$j.Source}}, check the fields</span>{{end}}</div>
</form>
<form method="post" action="/jobs" class="fields">
  <input type="hidden" name="back" value="">
  <label>Company<input name="company" required maxlength="200" value="{{$j.Company}}" autofocus></label>
  <label>Title<input name="title" required maxlength="200" value="{{$j.Title}}"></label>
  <label class="span-2">Posting URL<input name="url" type="url" placeholder="https://" value="{{$j.URL}}"></label>
  <label>Location<input name="location" placeholder="Berlin" value="{{$j.Location}}"></label>
  <label>Remote<select name="remote"><option value="">unknown</option><option value="remote" {{if eq $j.Remote "remote"}}selected{{end}}>remote</option><option value="hybrid" {{if eq $j.Remote "hybrid"}}selected{{end}}>hybrid</option><option value="onsite" {{if eq $j.Remote "onsite"}}selected{{end}}>onsite</option></select></label>
  <label>Salary min<input name="salary_min" type="number" min="0" step="1000" value="{{or $j.SalaryMin ""}}"></label>
  <label>Salary max<input name="salary_max" type="number" min="0" step="1000" value="{{or $j.SalaryMax ""}}"></label>
  <label>Currency<input name="currency" value="{{$j.Currency}}" maxlength="3"></label>
  <label>Deadline<input name="deadline" type="date" value="{{$j.Deadline}}"></label>
  <label>Posted<input name="posted_at" type="date" value="{{$j.PostedAt}}"></label>
  <label>Source<input name="source" placeholder="linkedin, referral, greenhouse" value="{{$j.Source}}"></label>
  <label class="span-2">Apply to<input name="contact" placeholder="jobs@acme.com or a recruiter address"></label>
  <label class="span-2">Tags<input name="tags" placeholder="go, kubernetes, fintech" value="{{$j.Tags}}"></label>
  <label class="span-2">Notes<textarea name="notes" rows="{{if $j.Notes}}10{{else}}4{{end}}" placeholder="Paste the requirements or anything worth remembering. Treated as text, never as instructions.">{{$j.Notes}}</textarea></label>
  <div class="row span-2"><button class="primary">Add job</button><a class="btn" href="{{.Back}}">Cancel</a><span class="muted">An existing company + title is updated, not duplicated.</span></div>
</form>
</section>
{{end}}
{{template "foot" .}}
