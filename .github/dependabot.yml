version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # Wait a week before a new release lands, so a bad or malicious one is
    # caught upstream first.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
  - package-ecosystem: gomod
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    ignore:
      # 1.x breaks the Antora build (`block.$!= is not a function`)
      - dependency-name: asciidoctor-kroki
        update-types: ["version-update:semver-major"]
  - package-ecosystem: bundler
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
